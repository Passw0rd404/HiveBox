# Complete workflow that runs unit tests AND checks 90% coverage
name: Tests, Coverage and SonarCloud

on:
  push:
    branches: [main]
    paths:
      - src/**
      - testing/**
jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Run unit tests with coverage check
      run: |
        # This command does BOTH:
        # 1. Runs all your unit tests
        # 2. Checks that coverage is >= 30%
        python -m pytest testing/ -v \
          --cov=src \
          --cov-report=xml \
          --cov-fail-under=30

    - name: Test /version endpoint
      run: pytest testing/

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
