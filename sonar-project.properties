# Project Identification
sonar.projectKey=hive-box  # Unique ID in SonarQube
sonar.projectName=HiveBox  # Display name
sonar.projectVersion=1.0   # Version tracking

# Source Configuration
sonar.sources=src/          # Where your main code lives
sonar.tests=testing/        # Where your tests live
sonar.language=py          # Primary language

# Coverage Configuration
sonar.python.coverage.reportPaths=coverage.xml  # Coverage data source

# Exclusion Rules
sonar.exclusions=**/__pycache__/**,**/*.pyc,venv/**,.venv/**
# ^ Excludes:
#   - Python cache directories
#   - Compiled Python files
#   - Virtual environments
