## MinIO Development Configuration

# Mode: standalone for dev (use 'distributed' for production)
mode: standalone

# Root credentials (change these for production!)
rootUser: minioadmin
rootPassword: minioadmin123

# Replicas (1 for dev, 4+ for production)
replicas: 1

# Persistence configuration
persistence:
  enabled: true
  storageClass: ""  # Use default storage class
  accessMode: ReadWriteOnce
  size: 5Gi  # Reduced for dev (10Gi is fine too)

# Resource limits (optimized for dev)
resources:
  requests:
    memory: 256Mi  # Reduced from 512Mi
    cpu: 100m      # Reduced from 250m
  limits:
    memory: 512Mi  # Reduced from 1Gi
    cpu: 250m      # Reduced from 500m

# Service configuration - CHANGED to ClusterIP
service:
  type: ClusterIP  # Better for Kubernetes service discovery
  port: 9000
  # nodePort: 30900  # Remove nodePort for ClusterIP

# Console service (MinIO UI) - CHANGED to ClusterIP
consoleService:
  type: ClusterIP
  port: 9001
  # nodePort: 30901  # Remove nodePort for ClusterIP

# Security context
securityContext:
  enabled: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Enable/disable console
consoleEnabled: true

# Buckets to create on startup - SIMPLIFIED
buckets:
  - name: temperature-data  # Match your app's expected bucket
    policy: none
    purge: false

# Users to create (optional) - REMOVED (use root for dev)
# users: []

# Environment variables - UPDATED
environment:
  MINIO_BROWSER: "on"
  MINIO_PROMETHEUS_AUTH_TYPE: "public"

# Ingress (disabled for dev)
ingress:
  enabled: false

# Metrics
metrics:
  serviceMonitor:
    enabled: false

# Disable TLS for dev
tls:
  enabled: false

# NetworkPolicy (allow all in dev)
networkPolicy:
  enabled: false

# Extra args for dev
extraArgs:
  - --quiet  # Reduce logs
