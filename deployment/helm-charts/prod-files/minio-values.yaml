## MinIO Production Configuration

mode: distributed
replicas: 4

rootUser: "minioadmin"
rootPassword: "minioadmin123!"

persistence:
  enabled: true
  storageClass: "gp2"
  accessMode: ReadWriteOnce
  size: 5Gi

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 250m

service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001

securityContext:
  enabled: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

consoleEnabled: true

buckets:
  - name: temperature-data
    policy: none
    purge: false
  - name: hivebox-backups
    policy: none
    purge: false

environment:
  MINIO_BROWSER: "on"
  MINIO_PROMETHEUS_AUTH_TYPE: "public"

ingress:
  enabled: false

metrics:
  serviceMonitor:
    enabled: true
    interval: 30s

tls:
  enabled: false  # No TLS

networkPolicy:
  enabled: true
  allowExternal: false
  explicitNamespaces:
    - hivebox-production

statefulset:
  replicas: 4
  volumeClaimTemplate:
    metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "gp2"
      resources:
        requests:
          storage: 50Gi
