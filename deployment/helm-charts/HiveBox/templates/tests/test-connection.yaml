apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-connection" (include "HiveBox.fullname" .) }}
  labels:
    {{- include "HiveBox.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "HiveBox.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
